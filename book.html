<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>恐龙找物 · 翻书版</title>
<link rel="stylesheet" href="css/app.css?v=20260925">
<link rel="stylesheet" href="css/book.css?v=20260925">
</head>
<body class="bookBody">

<div class="bookWrap" id="wrap">
  <div class="stage" id="stage">
    <div class="leaf" id="leafBack"></div>
    <div class="leaf" id="leafFront"></div>
    <div class="castShadow" id="cast"></div>
    <div id="flipLayer"></div>
    <div class="edgeZone left" id="zoneL"></div>
    <div class="edgeZone right" id="zoneR"></div>
  </div>
  <div class="hud" id="hud">
    <button id="btnPrev">‹ 上一页</button>
    <button id="btnToc">目录</button>
    <span class="pageNo" id="pageNo"></span>
    <button id="btnNext">下一页 ›</button>
  </div>
</div>

<div class="gameOverlay" id="overlay" hidden>
  <!-- 关掉浮层：游戏里的「返回」按钮或 Esc（不放悬浮按钮，免得压住游戏自己的「提示」） -->
  <iframe id="frame" title="关卡"></iframe>
</div>

<script src="js/util.js?v=20260925"></script>
<script src="js/store.js?v=20260925"></script>
<!-- 关卡数据按分钟时间戳加载，改了数据刷新就能看到 -->
<script>document.write('<script src="js/data.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>')</script>
<script src="js/book.js?v=20260925"></script>
</body>
</html>
