<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>恐龙找物 · 翻书版</title>
<link rel="stylesheet" href="css/app.css?v=20260925">
<link rel="stylesheet" href="css/book.css?v=20260926">
</head>
<body class="bookBody">

<div class="bookWrap" id="wrap">
  <div class="stage" id="stage">
    <div class="leaf" id="leafBack"></div>
    <div class="leaf" id="leafFront"></div>
    <div class="castShadow" id="cast"></div>
    <div id="flipLayer"></div>
    <!-- 左右贴边的翻页抓手：压在游戏页上面也能拖，只占十几像素，不挡物品栏 -->
    <div class="edgeGrab left" id="zoneL"></div>
    <div class="edgeGrab right" id="zoneR"></div>
  </div>
  <div class="hud" id="hud">
    <button id="btnPrev">‹ 上一页</button>
    <button id="btnToc">目录</button>
    <span class="pageNo" id="pageNo"></span>
    <button id="btnNext">下一页 ›</button>
  </div>
</div>

<!-- 相邻关的 iframe 先在这儿加载好，翻过去就不用等 -->
<div id="prefetch" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"></div>

<script src="js/util.js?v=20260925"></script>
<script src="js/store.js?v=20260925"></script>
<!-- 关卡数据按分钟时间戳加载，改了数据刷新就能看到 -->
<script>document.write('<script src="js/data.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>')</script>
<script src="js/book.js?v=20260926"></script>
</body>
</html>
