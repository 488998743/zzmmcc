<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="css/app.css?v=20260925">

    <div class="hero card">

        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

          <button class="btn ghost small" id="btnAbout">说明</button>
        </div>
      </div>

    <div class="hint" id="hint" hidden></div>

    <div class="grid" id="grid"></div>

    <div class="foot">
      <button class="btn ghost small" id="btnReset">重置全部进度</button>
    </div>

    <div class="copy">素材来源：《极限视觉挑战 · 恐龙》扫描页 · 仅供学习交流</div>

<script src="js/util.js?v=20260925"></script>
